<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="t6">
  <title id="t6">Ilustração de reforço escolar</title>

  <!-- open book -->
  <g transform="translate(100 92)">
    <path d="M0 -30 C-24 -40 -50 -36 -50 -24 L-50 26 C-50 14 -24 18 0 28 Z" fill="#FFF7EA" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -30 C24 -40 50 -36 50 -24 L50 26 C50 14 24 18 0 28 Z" fill="#FFF7EA" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <line x1="-38" y1="-18" x2="-10" y2="-12" stroke="#000000" stroke-width="2.5" opacity="0.5"/>
    <line x1="-38" y1="-6" x2="-10" y2="0" stroke="#000000" stroke-width="2.5" opacity="0.5"/>
    <line x1="10" y1="-12" x2="38" y2="-18" stroke="#000000" stroke-width="2.5" opacity="0.5"/>
    <line x1="10" y1="0" x2="38" y2="-6" stroke="#000000" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- pencil -->
  <g transform="translate(175 30) rotate(45)">
    <rect x="-8" y="0" width="16" height="70" fill="#F7A93B" stroke="#000000" stroke-width="4"/>
    <path d="M-8 0 L0 -18 L8 0 Z" fill="#FFF7EA" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-8" y="62" width="16" height="10" fill="#5CE1E6" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- lightbulb idea -->
  <g transform="translate(45 35)">
    <circle cx="0" cy="0" r="16" fill="#F8C91E" stroke="#000000" stroke-width="4"/>
    <rect x="-6" y="14" width="12" height="8" rx="2" fill="#FFF7EA" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
