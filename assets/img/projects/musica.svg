<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="t2">
  <title id="t2">Ilustração de música</title>
  <!-- treble clef -->
  <path d="M108 30 C88 30 82 55 100 66 C118 77 130 90 118 104 C108 115 92 110 92 96 C92 86 103 83 108 90"
