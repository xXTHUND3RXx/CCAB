    <line x1="150" y1="50" x2="150" y2="100" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="142" cy="100" r="10" fill="#FFF7EA" stroke="#000000" stroke-width="4"/>
    <line x1="150" y1="50" x2="172" y2="58" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
