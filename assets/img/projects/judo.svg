<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="t3">
  <title id="t3">Ilustração de judô</title>

  <!-- figure 1: throwing stance -->
  <g transform="translate(95 100)">
    <rect x="-7" y="-58" width="14" height="14" rx="7" fill="#FFF7EA" stroke="#000000" stroke-width="4"/>
    <rect x="-12" y="-42" width="24" height="34" rx="10" fill="#FFF7EA" stroke="#000000" stroke-width="4"/>
    <rect x="-6" y="-8" width="26" height="10" rx="5" fill="#F7A93B" stroke="#000000" stroke-width="3"/>
    <rect x="-13" y="-10" width="13" height="34" rx="6.5" fill="#FFF7EA" stroke="#000000" stroke-width="4" transform="rotate(20 -6 -10)"/>
    <rect x="0" y="-10" width="13" height="34" rx="6.5" fill="#FFF7EA" stroke="#000000" stroke-width="4" transform="rotate(-8 6 -10)"/>
    <rect x="-14" y="-40" width="13" height="30" rx="6.5" fill="#FFF7EA" stroke="#000000" stroke-width="4" transform="rotate(-40 -7 -40)"/>
    <rect x="1" y="-40" width="13" height="30" rx="6.5" fill="#FFF7EA" stroke="#000000" stroke-width="4" transform="rotate(55 7 -40)"/>
  </g>

  <!-- figure 2: being thrown / lower stance -->
  <g transform="translate(150 118) rotate(-20)">
    <circle cx="0" cy="-46" r="12" fill="#FFF7EA" stroke="#000000" stroke-width="4"/>
    <rect x="-11" y="-34" width="22" height="30" rx="9" fill="#FFF7EA" stroke="#000000" stroke-width="4"/>
    <rect x="-3" y="-8" width="22" height="9" rx="4.5" fill="#5CE1E6" stroke="#000000" stroke-width="3"/>
    <rect x="-12" y="-6" width="12" height="28" rx="6" fill="#FFF7EA" stroke="#000000" stroke-width="4" transform="rotate(30 -6 -6)"/>
    <rect x="4" y="-6" width="12" height="28" rx="6" fill="#FFF7EA" stroke="#000000" stroke-width="4" transform="rotate(-10 10 -6)"/>
  </g>

  <ellipse cx="130" cy="146" rx="70" ry="7" fill="#000000" opacity="0.12"/>
</svg>
