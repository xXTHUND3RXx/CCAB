<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="owlTitle">
  <title id="owlTitle">Coruja mascote da CCAB usando boné</title>
  <defs>
    <clipPath id="capClip">
      <path d="M40 78 C40 40 80 18 110 18 C140 18 180 40 180 78 L180 92 L40 92 Z"/>
    </clipPath>
  </defs>

  <!-- body -->
  <ellipse cx="110" cy="140" rx="72" ry="66" fill="#5E17EB"/>
  <ellipse cx="110" cy="150" rx="54" ry="48" fill="#FFF7EA"/>

  <!-- wings -->
  <ellipse cx="46" cy="150" rx="18" ry="34" fill="#FF66C4"/>
  <ellipse cx="174" cy="150" rx="18" ry="34" fill="#FF66C4"/>

  <!-- feet -->
  <path d="M88 202 l-6 14 M88 202 l0 15 M88 202 l6 14" stroke="#F7A93B" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M132 202 l-6 14 M132 202 l0 15 M132 202 l6 14" stroke="#F7A93B" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- face plate -->
  <circle cx="110" cy="120" r="58" fill="#FFF7EA"/>

  <!-- eyes -->
  <circle cx="86" cy="118" r="20" fill="#FFFFFF"/>
  <circle cx="134" cy="118" r="20" fill="#FFFFFF"/>
  <circle cx="86" cy="118" r="20" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="134" cy="118" r="20" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="88" cy="118" r="9" fill="#000000"/>
  <circle cx="132" cy="118" r="9" fill="#000000"/>
  <circle cx="91" cy="114" r="3" fill="#FFFFFF"/>
  <circle cx="135" cy="114" r="3" fill="#FFFFFF"/>

  <!-- beak -->
  <path d="M110 132 L98 148 L122 148 Z" fill="#F7A93B"/>

  <!-- brows -->
  <path d="M68 100 Q86 88 104 100" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M116 100 Q134 88 152 100" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- cap -->
  <g clip-path="url(#capClip)">
    <rect x="30" y="10" width="160" height="90" fill="#00979E"/>
    <path d="M40 78 C40 40 80 18 110 18 C140 18 180 40 180 78" fill="none" stroke="#000000" stroke-width="0"/>
  </g>
  <path d="M40 78 C40 40 80 18 110 18 C140 18 180 40 180 78 L180 92 L40 92 Z" fill="none" stroke="#000000" stroke-width="3"/>
  <ellipse cx="110" cy="20" rx="10" ry="7" fill="#5CE1E6" stroke="#000000" stroke-width="3"/>

  <!-- cap brim -->
  <path d="M34 86 Q110 116 186 86 L186 96 Q110 126 34 96 Z" fill="#000000"/>
  <path d="M34 86 Q110 116 186 86 L186 96 Q110 126 34 96 Z" fill="#FFBD59" opacity="0.15"/>
</svg>
